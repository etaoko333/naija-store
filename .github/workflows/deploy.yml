name: 🛒 Naija Store — Full Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: naija-store
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:

  # ────────────────────────────────────────────
  # JOB 1: Terraform — Build Infrastructure
  # ────────────────────────────────────────────
  terraform:
    name: 🏗️ Terraform Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      ecr_url:           ${{ steps.outputs.outputs.ecr_url }}
      ecs_cluster:       ${{ steps.outputs.outputs.ecs_cluster }}
      ecs_service:       ${{ steps.outputs.outputs.ecs_service }}
      static_bucket:     ${{ steps.outputs.outputs.static_bucket }}
      cloudfront_id:     ${{ steps.outputs.outputs.cloudfront_id }}
      cognito_pool_id:   ${{ steps.outputs.outputs.cognito_pool_id }}
      cognito_client_id: ${{ steps.outputs.outputs.cognito_client_id }}
      api_gateway_url:   ${{ steps.outputs.outputs.api_gateway_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Bootstrap state backend
        run: |
          echo "==> Creating S3 state bucket if not exists..."
          aws s3api head-bucket --bucket naija-store-terraform-state \
            --region us-east-1 2>/dev/null || \
          aws s3 mb s3://naija-store-terraform-state --region us-east-1

          aws s3api put-bucket-versioning \
            --bucket naija-store-terraform-state \
            --versioning-configuration Status=Enabled \
            --region us-east-1

          echo "==> Creating DynamoDB lock table if not exists..."
          TABLE_STATUS=$(aws dynamodb describe-table \
            --table-name naija-store-lock \
            --region us-east-1 \
            --query 'Table.TableStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$TABLE_STATUS" = "NOT_FOUND" ]; then
            aws dynamodb create-table \
              --table-name naija-store-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1
            echo "==> Waiting for table to become ACTIVE..."
            aws dynamodb wait table-exists \
              --table-name naija-store-lock \
              --region us-east-1
          else
            echo "==> Lock table already exists with status: $TABLE_STATUS"
          fi

          echo "==> Clearing any stale state locks..."
          aws dynamodb delete-item \
            --table-name naija-store-lock \
            --key '{"LockID": {"S": "naija-store-terraform-state/prod/terraform.tfstate"}}' \
            --region us-east-1 2>/dev/null || echo "No stale lock found"

          echo "==> Backend bootstrap complete!"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform outputs
        id: outputs
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)"            >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)"          >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)"          >> $GITHUB_OUTPUT
          echo "static_bucket=$(terraform output -raw static_bucket_name)"      >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "cognito_pool_id=$(terraform output -raw cognito_user_pool_id)"  >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)"   >> $GITHUB_OUTPUT
          echo "api_gateway_url=$(terraform output -raw api_gateway_endpoint)"  >> $GITHUB_OUTPUT

      - name: Infrastructure summary
        run: |
          echo "## 🏗️ Infrastructure Ready"              >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |"                     >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                                >> $GITHUB_STEP_SUMMARY
          echo "| **Store URL** | https://eta-oko.com |"  >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | us-east-1 |"               >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB 2: Build & Push Docker image to ECR
  # ────────────────────────────────────────────
  build-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.terraform.outputs.ecr_url }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: true
          pull: true
          build-args: |
            VITE_COGNITO_USER_POOL_ID=${{ needs.terraform.outputs.cognito_pool_id }}
            VITE_COGNITO_CLIENT_ID=${{ needs.terraform.outputs.cognito_client_id }}
            VITE_API_URL=${{ needs.terraform.outputs.api_gateway_url }}
            VITE_AWS_REGION=${{ env.AWS_REGION }}

  # ────────────────────────────────────────────
  # JOB 3: Deploy React frontend to S3
  # ────────────────────────────────────────────
  deploy-static:
    name: ☁️ Deploy Frontend to S3
    runs-on: ubuntu-latest
    needs: [terraform, build-push]
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ needs.terraform.outputs.cognito_pool_id }}
          VITE_COGNITO_CLIENT_ID:    ${{ needs.terraform.outputs.cognito_client_id }}
          VITE_API_URL:              ${{ needs.terraform.outputs.api_gateway_url }}
          VITE_AWS_REGION:           ${{ env.AWS_REGION }}
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ needs.terraform.outputs.static_bucket }}/ \
            --exclude "*.html" \
            --cache-control "max-age=31536000,public,immutable" \
            --delete
          aws s3 sync dist/ s3://${{ needs.terraform.outputs.static_bucket }}/ \
            --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        if: ${{ needs.terraform.outputs.cloudfront_id != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Static deploy summary
        run: |
          echo "## ☁️ Frontend Deployed to S3"                                  >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |"                                                >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                                                       >> $GITHUB_STEP_SUMMARY
          echo "| **Bucket** | ${{ needs.terraform.outputs.static_bucket }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | Deployed and cache invalidated |"                >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB 4: Deploy container to ECS Fargate
  # ────────────────────────────────────────────
  deploy-ecs:
    name: 🚀 Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: [terraform, build-push, deploy-static]
    environment:
      name: production
      url: https://eta-oko.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_NAME }}-task \
            --query taskDefinition \
            > task-definition.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.PROJECT_NAME }}-app
          image:           ${{ needs.terraform.outputs.ecr_url }}:build-${{ github.run_number }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    ${{ needs.terraform.outputs.ecs_service }}
          cluster:                    ${{ needs.terraform.outputs.ecs_cluster }}
          wait-for-service-stability: true
          wait-for-minutes:           10

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete!"                                     >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |"                                                >> $GITHUB_STEP_SUMMARY
          echo "|---|---|"                                                       >> $GITHUB_STEP_SUMMARY
          echo "| **Store URL** | https://eta-oko.com |"                        >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | build-${{ github.run_number }} |"                 >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed By** | ${{ github.actor }} |"                      >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | us-east-1 |"                                     >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |"               >> $GITHUB_STEP_SUMMARY